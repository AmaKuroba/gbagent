<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBAGent Dashboard</title>
<style>
/* ============================================================
   Dark cyberpunk theme — Game Boy RL agent dashboard
   ============================================================ */
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --accent2: #3fb950;
  --danger: #f85149;
  --warning: #d29922;
  --green: #238636;
  --green-hover: #2ea043;
  --screen-border: #1f2937;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---- Header ---- */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
header h1 span { color: var(--accent); }
#status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
  background: var(--bg3);
  border: 1px solid var(--border);
  transition: background .2s, border-color .2s;
}
#status-badge .dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--danger);
  transition: background .3s;
}
#status-badge.connected .dot { background: var(--accent2); }
#status-badge.training .dot { background: var(--warning); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ---- Layout ---- */
.container {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  gap: 16px;
  padding: 16px 24px;
  max-width: 1400px;
  margin: 0 auto;
}

/* ---- Left: screen ---- */
.screen-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.screen-panel h2 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 12px;
  align-self: flex-start;
}
#screen-canvas {
  width: 100%;
  max-width: 480px;
  aspect-ratio: 160 / 144;
  image-rendering: pixelated;
  background: #000;
  border: 2px solid var(--screen-border);
  border-radius: 4px;
  display: block;
}
#no-frame {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 480px;
  aspect-ratio: 160 / 144;
  background: #0a0e14;
  border: 2px solid var(--screen-border);
  border-radius: 4px;
  color: var(--text-dim);
  font-size: 14px;
}

/* ---- Right panel ---- */
.right-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Cards */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.card h3 {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

/* ---- Joypad ---- */
.joypad-layout {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 48px);
  grid-template-rows: repeat(3, 48px);
  gap: 4px;
}
.dpad button {
  width: 48px; height: 48px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg3);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  transition: background .1s, transform .1s;
}
.dpad button:active, .dpad button.pressed {
  background: var(--accent);
  color: #fff;
  transform: scale(.92);
}
.dpad button:nth-child(1) { grid-column: 2; grid-row: 1; }  /* UP */
.dpad button:nth-child(2) { grid-column: 1; grid-row: 2; }  /* LEFT */
.dpad button:nth-child(3) { grid-column: 2; grid-row: 2; }  /* DOWN */
.dpad button:nth-child(4) { grid-column: 3; grid-row: 2; }  /* RIGHT */

.action-buttons {
  display: grid;
  grid-template-columns: repeat(2, 56px);
  grid-template-rows: repeat(2, 56px);
  gap: 6px;
}
.action-buttons button {
  width: 56px; height: 56px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--bg3);
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  transition: background .1s, transform .1s;
}
.action-buttons button:nth-child(1) { grid-column: 2; grid-row: 1; }  /* A */
.action-buttons button:nth-child(2) { grid-column: 1; grid-row: 1; }  /* B */
.action-buttons button:nth-child(3) { grid-column: 1; grid-row: 2; }  /* SELECT */
.action-buttons button:nth-child(4) { grid-column: 2; grid-row: 2; }  /* START */
.action-buttons button:active, .action-buttons button.pressed {
  background: var(--accent2);
  color: #fff;
  transform: scale(.9);
}

/* ---- Train controls ---- */
.train-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
#btn-train {
  padding: 8px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: var(--green);
  color: #fff;
  transition: background .15s;
}
#btn-train:hover { background: var(--green-hover); }
#btn-train.running {
  background: var(--danger);
}
#btn-train.running:hover { background: #da3633; }
#train-status {
  font-size: 13px;
  color: var(--text-dim);
}

/* ---- Metrics ---- */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.metric-item {
  background: var(--bg3);
  border-radius: 4px;
  padding: 6px 10px;
}
.metric-item .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-dim);
}
.metric-item .value {
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.metric-item .value.positive { color: var(--accent2); }
.metric-item .value.negative { color: var(--danger); }

/* ---- Reward chart ---- */
#reward-chart {
  width: 100%;
  height: 120px;
  display: block;
}

/* ---- Event log ---- */
#event-log {
  max-height: 120px;
  overflow-y: auto;
  font-family: "SF Mono", "Monaco", "Menlo", monospace;
  font-size: 11px;
  line-height: 1.6;
}
#event-log::-webkit-scrollbar { width: 4px; }
#event-log::-webkit-scrollbar-track { background: transparent; }
#event-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.log-entry {
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.log-entry .time { color: var(--text-dim); opacity: .6; }
.log-entry.info { color: var(--accent); }
.log-entry.event { color: var(--warning); }
.log-entry.error { color: var(--danger); }

/* ---- Responsive ---- */
@media (max-width: 860px) {
  .container {
    grid-template-columns: 1fr;
  }
  #screen-canvas, #no-frame { max-width: 100%; }
}
</style>
</head>
<body>

<header>
  <h1><span>GB</span>Agent</h1>
  <div id="status-badge"><span class="dot"></span><span id="status-text">Disconnected</span></div>
</header>

<div class="container">
  <!-- Left: Live screen -->
  <div class="screen-panel">
    <h2>Live Screen</h2>
    <canvas id="screen-canvas" width="160" height="144" style="display:none"></canvas>
    <div id="no-frame">Waiting for frame…</div>
  </div>

  <!-- Right panel -->
  <div class="right-panel">

    <!-- Joypad -->
    <div class="card">
      <h3>Joypad</h3>
      <div class="joypad-layout">
        <div class="dpad" id="dpad">
          <button data-btn="UP"    title="Up">▲</button>
          <button data-btn="LEFT"  title="Left">◀</button>
          <button data-btn="DOWN"  title="Down">▼</button>
          <button data-btn="RIGHT" title="Right">▶</button>
        </div>
        <div class="action-buttons" id="action-buttons">
          <button data-btn="A"      title="A">A</button>
          <button data-btn="B"      title="B">B</button>
          <button data-btn="SELECT" title="Select">SEL</button>
          <button data-btn="START"  title="Start">STA</button>
        </div>
      </div>
    </div>

    <!-- Train controls -->
    <div class="card">
      <h3>Training</h3>
      <div class="train-row">
        <button id="btn-train">Start Training</button>
        <span id="train-status">Idle</span>
      </div>
    </div>

    <!-- Metrics -->
    <div class="card">
      <h3>Metrics</h3>
      <div class="metrics-grid" id="metrics-grid">
        <div class="metric-item"><div class="label">Step</div><div class="value" id="m-step">—</div></div>
        <div class="metric-item"><div class="label">SPS</div><div class="value" id="m-sps">—</div></div>
        <div class="metric-item"><div class="label">Return</div><div class="value" id="m-return">—</div></div>
        <div class="metric-item"><div class="label">Loss</div><div class="value" id="m-loss">—</div></div>
      </div>
    </div>

    <!-- Reward chart -->
    <div class="card">
      <h3>Reward History</h3>
      <canvas id="reward-chart" width="700" height="240"></canvas>
    </div>

    <!-- Event log -->
    <div class="card">
      <h3>Event Log</h3>
      <div id="event-log"></div>
    </div>

  </div>
</div>

<script>
/* ============================================================
   Dashboard JS — WebSocket, frame rendering, joypad, chart, log
   ============================================================ */

(function () {
  'use strict';

  // ---- Config ----
  const WS_URL = (() => {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${proto}//${location.host}/ws`;
  })();
  const RECONNECT_DELAY = 2000;
  const MAX_LOG_ENTRIES = 100;

  // ---- DOM refs ----
  const canvas = document.getElementById('screen-canvas');
  const ctx = canvas.getContext('2d');
  const noFrame = document.getElementById('no-frame');
  const statusBadge = document.getElementById('status-badge');
  const statusText = document.getElementById('status-text');
  const btnTrain = document.getElementById('btn-train');
  const trainStatus = document.getElementById('train-status');
  const eventLog = document.getElementById('event-log');
  const chartCanvas = document.getElementById('reward-chart');
  const chartCtx = chartCanvas.getContext('2d');

  // Metric elements
  const mStep = document.getElementById('m-step');
  const mSps = document.getElementById('m-sps');
  const mReturn = document.getElementById('m-return');
  const mLoss = document.getElementById('m-loss');

  // ---- State ----
  let ws = null;
  let reconnectTimer = null;
  let isTraining = false;
  let joypadState = {};

  // Reward history for chart (rolling window of 200 points)
  const rewardHistory = [];
  const MAX_REWARD_POINTS = 200;

  // ---- Joypad button helpers ----
  const joypadButtons = {};
  document.querySelectorAll('[data-btn]').forEach(el => {
    const btn = el.dataset.btn;
    joypadButtons[btn] = el;
  });

  function sendJoypadState() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'joypad', state: joypadState }));
  }

  // Mouse/touch press
  function pressButton(btn) {
    if (joypadState[btn]) return;
    joypadState[btn] = true;
    const el = joypadButtons[btn];
    if (el) el.classList.add('pressed');
    sendJoypadState();
  }

  function releaseButton(btn) {
    if (!joypadState[btn]) return;
    joypadState[btn] = false;
    const el = joypadButtons[btn];
    if (el) el.classList.remove('pressed');
    sendJoypadState();
  }

  // Attach event listeners to joypad buttons
  document.querySelectorAll('[data-btn]').forEach(el => {
    const btn = el.dataset.btn;
    // Mouse
    el.addEventListener('mousedown', e => { e.preventDefault(); pressButton(btn); });
    el.addEventListener('mouseup',   e => { e.preventDefault(); releaseButton(btn); });
    el.addEventListener('mouseleave', e => { releaseButton(btn); });
    // Touch
    el.addEventListener('touchstart', e => { e.preventDefault(); pressButton(btn); }, { passive: false });
    el.addEventListener('touchend',   e => { e.preventDefault(); releaseButton(btn); }, { passive: false });
    el.addEventListener('touchcancel', e => { releaseButton(btn); });
  });

  // Keyboard support
  const KEY_MAP = {
    ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT',
    KeyZ: 'B', KeyX: 'A', KeyA: 'SELECT', KeyS: 'START',
  };
  document.addEventListener('keydown', e => {
    const btn = KEY_MAP[e.code];
    if (btn) { e.preventDefault(); pressButton(btn); }
  });
  document.addEventListener('keyup', e => {
    const btn = KEY_MAP[e.code];
    if (btn) { e.preventDefault(); releaseButton(btn); }
  });

  // Release all buttons on blur (tab switch etc)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      Object.keys(joypadState).forEach(k => releaseButton(k));
    }
  });

  // ---- Train button ----
  btnTrain.addEventListener('click', () => {
    if (isTraining) {
      // Request stop
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'command', command: 'train_stop' }));
      }
      addLog('event', 'Stop requested');
    } else {
      // Request start
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'command', command: 'train_start' }));
      }
      addLog('event', 'Training requested');
    }
  });

  // ---- Event log ----
  function addLog(kind, msg) {
    const now = new Date();
    const time = now.toLocaleTimeString('en-US', { hour12: false });
    const el = document.createElement('div');
    el.className = `log-entry ${kind}`;
    el.innerHTML = `<span class="time">[${time}]</span> ${msg}`;
    eventLog.appendChild(el);
    eventLog.scrollTop = eventLog.scrollHeight;
    while (eventLog.children.length > MAX_LOG_ENTRIES) {
      eventLog.removeChild(eventLog.firstChild);
    }
  }

  // ---- Reward chart ----
  function drawChart() {
    const w = chartCanvas.width;
    const h = chartCanvas.height;
    chartCtx.clearRect(0, 0, w, h);

    if (rewardHistory.length < 2) {
      chartCtx.fillStyle = '#8b949e';
      chartCtx.font = '12px sans-serif';
      chartCtx.textAlign = 'center';
      chartCtx.fillText('Waiting for data…', w/2, h/2);
      return;
    }

    const pad = { top: 8, bottom: 16, left: 4, right: 4 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    const vals = rewardHistory;
    const min = Math.min(...vals);
    const max = Math.max(...vals);
    const range = Math.max(max - min, 0.01);

    const points = vals.map((v, i) => ({
      x: pad.left + (i / (vals.length - 1)) * plotW,
      y: pad.top + plotH - ((v - min) / range) * plotH,
    }));

    // Grid lines
    chartCtx.strokeStyle = '#21262d';
    chartCtx.lineWidth = 1;
    for (let ny = 0; ny <= 4; ny++) {
      const y = pad.top + (ny / 4) * plotH;
      chartCtx.beginPath();
      chartCtx.moveTo(pad.left, y);
      chartCtx.lineTo(w - pad.right, y);
      chartCtx.stroke();
    }

    // Area fill
    chartCtx.beginPath();
    chartCtx.moveTo(points[0].x, pad.top + plotH);
    points.forEach(p => chartCtx.lineTo(p.x, p.y));
    chartCtx.lineTo(points[points.length-1].x, pad.top + plotH);
    chartCtx.closePath();
    chartCtx.fillStyle = 'rgba(88, 166, 255, 0.12)';
    chartCtx.fill();

    // Line
    chartCtx.beginPath();
    points.forEach((p, i) => {
      i === 0 ? chartCtx.moveTo(p.x, p.y) : chartCtx.lineTo(p.x, p.y);
    });
    chartCtx.strokeStyle = '#58a6ff';
    chartCtx.lineWidth = 2;
    chartCtx.stroke();

    // Y-axis labels
    chartCtx.fillStyle = '#8b949e';
    chartCtx.font = '9px sans-serif';
    chartCtx.textAlign = 'right';
    chartCtx.fillText(max.toFixed(1), pad.left - 2, pad.top + 8);
    chartCtx.fillText(min.toFixed(1), pad.left - 2, pad.top + plotH + 4);
  }

  // ---- WebSocket ----
  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

    try {
      ws = new WebSocket(WS_URL);
    } catch (e) {
      setStatus('disconnected');
      addLog('error', `WebSocket connection failed: ${e.message}`);
      scheduleReconnect();
      return;
    }

    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      setStatus('connected');
      addLog('info', 'WebSocket connected');
      // Re-send joypad state on reconnect
      if (Object.keys(joypadState).length > 0) {
        sendJoypadState();
      }
    };

    ws.onmessage = (event) => {
      if (event.data instanceof ArrayBuffer) {
        handleBinary(event.data);
      } else {
        handleText(event.data);
      }
    };

    ws.onclose = () => {
      if (isTraining) {
        setStatus('training');
        addLog('event', 'WebSocket closed (training continues)');
      } else {
        setStatus('disconnected');
        addLog('error', 'WebSocket disconnected');
      }
      ws = null;
      scheduleReconnect();
    };

    ws.onerror = () => {
      // onclose will fire after this
    };
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connect();
    }, RECONNECT_DELAY);
  }

  // ---- Binary frame handling ----
  function handleBinary(buf) {
    const bytes = new Uint8Array(buf);

    // Protocol: first byte 0x00 = frame data
    if (bytes.length < 2 || bytes[0] !== 0x00) return;

    const pngData = bytes.slice(1);
    const blob = new Blob([pngData], { type: 'image/png' });
    const url = URL.createObjectURL(blob);

    const img = new Image();
    img.onload = () => {
      noFrame.style.display = 'none';
      canvas.style.display = 'block';
      // Clear canvas then draw
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  // ---- Text message handling ----
  function handleText(text) {
    let msg;
    try { msg = JSON.parse(text); } catch { return; }
    if (!msg || typeof msg !== 'object') return;

    switch (msg.type) {
      case 'metrics':
        updateMetrics(msg.data || msg);
        break;
      case 'event':
        handleEvent(msg);
        break;
      default:
        break;
    }
  }

  function updateMetrics(data) {
    if (!data) return;

    const step = data.step ?? data.global_step ?? data.train?.global_step;
    if (step !== undefined && step !== null) {
      mStep.textContent = typeof step === 'number' ? step.toLocaleString() : step;
    }

    const sps = data.sps ?? data['train/sps'];
    if (sps !== undefined) {
      mSps.textContent = typeof sps === 'number' ? sps.toFixed(0) : sps;
    }

    const ret = data.return_mean ?? data['episode/return_mean'] ?? data.return;
    if (ret !== undefined) {
      mReturn.textContent = typeof ret === 'number' ? ret.toFixed(2) : ret;
      mReturn.className = 'value' + (ret > 0 ? ' positive' : ret < 0 ? ' negative' : '');
      // Append to reward history
      if (typeof ret === 'number' && !isNaN(ret)) {
        rewardHistory.push(ret);
        if (rewardHistory.length > MAX_REWARD_POINTS) rewardHistory.shift();
        drawChart();
      }
    }

    const loss = data.policy_loss ?? data['loss/policy'] ?? data['loss/total'] ?? data.loss;
    if (loss !== undefined) {
      mLoss.textContent = typeof loss === 'number' ? loss.toFixed(4) : loss;
    }
  }

  function handleEvent(msg) {
    const event = msg.event || 'unknown';
    const eventMsg = msg.msg || '';

    if (event === 'train_start') {
      isTraining = true;
      btnTrain.textContent = 'Stop Training';
      btnTrain.classList.add('running');
      trainStatus.textContent = 'Running';
      setStatus('training');
    } else if (event === 'train_stop') {
      isTraining = false;
      btnTrain.textContent = 'Start Training';
      btnTrain.classList.remove('running');
      trainStatus.textContent = 'Idle';
      setStatus('connected');
    }

    addLog('event', `${event}${eventMsg ? ': ' + eventMsg : ''}`);
  }

  // ---- Status badge ----
  function setStatus(state) {
    statusBadge.className = '';
    if (state === 'connected') {
      statusBadge.classList.add('connected');
      statusText.textContent = 'Connected';
    } else if (state === 'training') {
      statusBadge.classList.add('training');
      statusText.textContent = 'Training';
    } else {
      statusText.textContent = 'Disconnected';
    }
  }

  // ---- Init ----
  addLog('info', 'Dashboard loaded. Connecting…');
  connect();
  drawChart();

  // Periodic chart redraw (for responsive canvas sizing)
  window.addEventListener('resize', drawChart);

})();
</script>
</body>
</html>
