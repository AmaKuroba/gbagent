name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy PyYAML pytest

      - name: Install TensorFlow (Linux)
        if: runner.os == 'Linux'
        run: pip install tensorflow

      - name: Install Keras with numpy backend (macOS)
        if: runner.os == 'macOS'
        run: pip install keras

      - name: Install package
        run: pip install -e . --no-deps

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests (macOS, numpy backend)
        if: runner.os == 'macOS'
        run: KERAS_BACKEND=numpy python -m pytest tests/ -v -k "not keras" --tb=short
