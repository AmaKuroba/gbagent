<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gbagent — Dashboard</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --text: #eaeaea;
    --muted: #8892b0;
    --green: #53d769;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.5rem 1.5rem;
    border-bottom: 1px solid var(--surface2);
    flex-shrink: 0;
  }
  .header h1 { font-size: 1.1rem; letter-spacing: 0.1em; }
  .header .subtitle { color: var(--muted); font-size: 0.75rem; }
  .header .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-dot.connected { background: var(--green); }
  .status-dot.disconnected { background: var(--accent); }

  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
    padding: 0.75rem;
    gap: 0.75rem;
  }

  .center {
    flex: 1;
    display: flex;
    min-width: 0;
    min-height: 0;
  }
  .screen-wrapper {
    flex: 1;
    background: var(--surface);
    border: 2px solid var(--surface2);
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(233,69,96,0.15);
    display: flex;
    min-height: 0;
  }
  #gb-screen {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    background: #000;
    border-radius: 4px;
    display: block;
    overflow: hidden;
  }

  .panel-right {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-right .panel-header {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--surface2);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    flex-shrink: 0;
  }

  .joypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 0.4rem;
    flex-shrink: 0;
  }
  .joypad .key {
    background: var(--surface2);
    border-radius: 4px;
    text-align: center;
    padding: 6px 0;
    font-size: 0.65rem;
    color: var(--muted);
    user-select: none;
  }
  .joypad .key.active { background: var(--accent); color: white; }
  .joypad .key.empty { visibility: hidden; }

  #takeover-btn { width:100%; padding:0.4rem; border:none; border-radius:4px; cursor:pointer; font:inherit; font-weight:bold; transition:0.2s; }
  #takeover-btn.takeover-off { background:#3a3; color:#fff; }
  #takeover-btn.takeover-on { background:#e33; color:#fff; }
  .state-buttons { display:flex; gap:4px; padding:4px; }
  .state-btn { flex:1; padding:4px; border:none; border-radius:4px; cursor:pointer; font:inherit; font-size:0.65rem; font-weight:bold; transition:0.2s; }
  .state-btn.save { background:#2196f3; color:#fff; }
  .state-btn.load { background:#ff9800; color:#fff; }
  .state-btn:active { opacity:0.7; }

  .log-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--surface2);
    min-height: 0;
  }
  .log-panel .log-header {
    padding: 0.4rem 0.75rem;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    flex-shrink: 0;
  }
  .log-panel #log {
    flex: 1;
    overflow-y: auto;
    padding: 0.3rem 0.5rem;
    font-size: 0.65rem;
    color: var(--muted);
    background: rgba(0,0,0,0.2);
  }
  .log-panel #log p { margin: 0.1rem 0; line-height: 1.3; }
  .log-panel #log p.error { color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <h1>gbagent</h1>
  <span class="subtitle">Dashboard</span>
  <div class="status">
    <span class="status-dot disconnected" id="status-dot"></span>
    <span id="status-text">Disconnected</span>
  </div>
</div>

<div class="layout">

  <!-- Center: GB Screen -->
  <div class="center">
    <div class="screen-wrapper">
      <canvas id="gb-screen" width="160" height="144"></canvas>
    </div>
  </div>

  <!-- Right: Controls -->
  <div class="panel-right">
    <button id="takeover-btn" class="takeover-off" onclick="toggleTakeover()">TAKE OVER</button>

    <div class="state-buttons">
      <button class="state-btn save" onclick="saveState()">SAVE</button>
      <button class="state-btn load" onclick="loadState()">LOAD</button>
    </div>

    <div class="joypad">
      <div class="key empty"></div>
      <div class="key" data-gb="UP">&uarr;</div>
      <div class="key empty"></div>
      <div class="key" data-gb="LEFT">&larr;</div>
      <div class="key" data-gb="DOWN">&darr;</div>
      <div class="key" data-gb="RIGHT">&rarr;</div>
      <div class="key" data-gb="SELECT">SEL</div>
      <div class="key" data-gb="START">STR</div>
      <div class="key empty"></div>
      <div class="key" data-gb="A">A</div>
      <div class="key empty"></div>
      <div class="key" data-gb="B">B</div>
    </div>

    <div class="log-panel">
      <div class="log-header">Log</div>
      <div id="log"></div>
    </div>
  </div>

</div>

<script>
const canvas = document.getElementById('gb-screen');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');

let ws = null;
let connected = false;
const KEY_MAP = {
  'w': 'UP', 'a': 'LEFT', 's': 'DOWN', 'd': 'RIGHT',
  'k': 'A', 'j': 'B', 'h': 'START', 'g': 'SELECT',
};

function log(msg, cls) {
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.textContent = '> ' + msg;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
  if (logEl.children.length > 100) logEl.removeChild(logEl.firstChild);
}

// Takeover
let takeoverActive = false;
function toggleTakeover() {
  takeoverActive = !takeoverActive;
  const btn = document.getElementById('takeover-btn');
  btn.textContent = takeoverActive ? 'RELEASE CONTROL' : 'TAKE OVER';
  btn.className = takeoverActive ? 'takeover-on' : 'takeover-off';
  if (connected && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ takeover: takeoverActive }));
  }
}

// Save/Load
let statePath = 'checkpoints/current.sav';
function saveState() {
  const path = prompt('Save state path:', statePath);
  if (!path) return;
  statePath = path;
  if (connected && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ save_state: path }));
  }
}
function loadState() {
  const path = prompt('Load state path:', statePath);
  if (!path) return;
  statePath = path;
  if (connected && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ load_state: path }));
  }
}

// WebSocket
function connect() {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');

  ws.onopen = () => {
    connected = true;
    document.getElementById('status-dot').className = 'status-dot connected';
    document.getElementById('status-text').textContent = 'Connected';
    log('WebSocket connected');
  };

  ws.onclose = () => {
    connected = false;
    document.getElementById('status-dot').className = 'status-dot disconnected';
    document.getElementById('status-text').textContent = 'Disconnected';
    log('WebSocket disconnected -- reconnecting in 2s', 'error');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => { log('WebSocket error', 'error'); };

  ws.binaryType = 'arraybuffer';
  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      const dv = new DataView(event.data);
      const type = dv.getUint8(0);
      const payload = event.data.slice(1);
      if (type === 0x00) {
        // PNG screenshot
        const blob = new Blob([payload], { type: 'image/png' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
        };
        img.onerror = () => { URL.revokeObjectURL(url); };
        img.src = url;
      }
    } else {
      try {
        JSON.parse(event.data);
      } catch(e) {
        log(event.data);
      }
    }
  };
}

// Keyboard input
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const gbBtn = KEY_MAP[e.key];
  if (gbBtn) {
    e.preventDefault();
    document.querySelector(`[data-gb="${gbBtn}"]`)?.classList.add('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: e.key, pressed: true }));
    }
  }
});

document.addEventListener('keyup', (e) => {
  const gbBtn = KEY_MAP[e.key];
  if (gbBtn) {
    e.preventDefault();
    document.querySelector(`[data-gb="${gbBtn}"]`)?.classList.remove('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: e.key, pressed: false }));
    }
  }
});

document.querySelectorAll('[data-gb]').forEach(el => {
  const gbBtn = el.dataset.gb;
  const keyName = { 'UP': 'w', 'DOWN': 's', 'LEFT': 'a', 'RIGHT': 'd',
                    'A': 'k', 'B': 'j', 'START': 'h', 'SELECT': 'g' }[gbBtn] || gbBtn;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    el.classList.add('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: keyName, pressed: true }));
    }
  });
  el.addEventListener('pointerup', (e) => {
    e.preventDefault();
    el.classList.remove('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: keyName, pressed: false }));
    }
  });
  el.addEventListener('pointerleave', (e) => {
    e.preventDefault();
    el.classList.remove('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: keyName, pressed: false }));
    }
  });
});

log('dashboard loaded');
connect();
</script>
</body>
</html>
