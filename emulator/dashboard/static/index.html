<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gbagent — Game Boy Dashboard</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --text: #eaeaea;
    --muted: #8892b0;
    --green: #53d769;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.5rem 1.5rem;
    border-bottom: 1px solid var(--surface2);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.1rem;
    letter-spacing: 0.1em;
  }
  .header .subtitle {
    color: var(--muted);
    font-size: 0.75rem;
  }
  .header .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .status-dot.connected { background: var(--green); }
  .status-dot.disconnected { background: var(--accent); }

  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
    padding: 0.75rem;
    gap: 0.75rem;
  }

  /* ---- Left panel: MCP Actions ---- */
  .panel-left {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-left .panel-header {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--surface2);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    flex-shrink: 0;
  }
  .panel-left .action-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.4rem;
  }
  .action-item {
    padding: 0.3rem 0.4rem;
    margin-bottom: 0.2rem;
    border-radius: 4px;
    font-size: 0.7rem;
    line-height: 1.3;
    border-left: 2px solid var(--surface2);
  }
  .action-item .action-tool {
    color: var(--green);
    font-weight: bold;
  }
  .action-item .action-args {
    color: var(--muted);
    word-break: break-all;
  }
  .action-item .action-time {
    color: var(--muted);
    font-size: 0.6rem;
    opacity: 0.6;
  }

  /* ---- Center: GB Screen ---- */
  .center {
    flex: 1;
    display: flex;
    min-width: 0;
    min-height: 0;
  }
  .screen-wrapper {
    flex: 1;
    background: var(--surface);
    border: 2px solid var(--surface2);
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(233,69,96,0.15);
    display: flex;
    min-height: 0;
  }
  #gb-screen {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    background: #000;
    border-radius: 4px;
    display: block;
    overflow: hidden;
  }
  .fps {
    color: var(--muted);
    font-size: 0.7rem;
    text-align: center;
    padding: 0.3rem 0;
    border-bottom: 1px solid var(--surface2);
  }

  /* ---- Right panel: State + Logs ---- */
  .panel-right {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-right .panel-header {
    padding: 0.6rem 0.75rem;
    border-bottom: 1px solid var(--surface2);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    flex-shrink: 0;
  }
  .state-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--surface2);
    font-size: 0.7rem;
  }
  .state-grid > div {
    background: var(--surface);
    padding: 0.3rem 0.5rem;
    display: flex;
    justify-content: space-between;
  }
  .state-grid .label { color: var(--muted); }
  .state-grid .value { color: var(--text); font-weight: bold; }

  .joypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 0.4rem;
    flex-shrink: 0;
  }
  .joypad .key {
    background: var(--surface2);
    border-radius: 4px;
    text-align: center;
    padding: 6px 0;
    font-size: 0.65rem;
    color: var(--muted);
    user-select: none;
  }
  .joypad .key.active { background: var(--accent); color: white; }
  .joypad .key.empty { visibility: hidden; }

  #takeover-btn { width:100%; padding:0.4rem; border:none; border-radius:4px; cursor:pointer; font:inherit; font-weight:bold; transition:0.2s; }
  #takeover-btn.takeover-off { background:#3a3; color:#fff; }
  #takeover-btn.takeover-on { background:#e33; color:#fff; }

  .log-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--surface2);
    min-height: 0;
  }
  .log-panel .log-header {
    padding: 0.4rem 0.75rem;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    flex-shrink: 0;
  }
  .log-panel #log {
    flex: 1;
    overflow-y: auto;
    padding: 0.3rem 0.5rem;
    font-size: 0.65rem;
    color: var(--muted);
    background: rgba(0,0,0,0.2);
  }
  .log-panel #log p { margin: 0.1rem 0; line-height: 1.3; }
  .log-panel #log p.error { color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <h1>gbagent</h1>
  <span class="subtitle">Game Boy Emulator</span>
  <div class="status">
    <span class="status-dot disconnected" id="status-dot"></span>
    <span id="status-text">Disconnected</span>
  </div>
</div>

<div class="layout">

  <!-- Left: MCP Actions -->
  <div class="panel-left">
    <div class="panel-header">Agent Actions</div>
    <div class="action-list" id="action-list">
      <div style="color:var(--muted);font-size:0.7rem;padding:0.5rem;text-align:center;">Waiting for actions...</div>
    </div>
  </div>

  <!-- Center: GB Screen -->
  <div class="center">
    <div class="screen-wrapper">
      <canvas id="gb-screen" width="160" height="144"></canvas>
    </div>
  </div>

  <!-- Right: Rewards + Controls -->
  <div class="panel-right">
    <canvas id="reward-chart" width="200" height="28" style="width:100%;height:28px;margin:4px 0;"></canvas>

    <div style="display:flex;gap:0.5rem;font-size:0.65rem;color:var(--muted);padding:0 2px;">
      <span>loss <strong id="loss-val" style="color:var(--text)">—</strong></span>
      <span>ε <strong id="eps-val" style="color:var(--text)">—</strong></span>
      <span style="margin-left:auto;">sps <strong id="sps-val" style="color:var(--text)">—</strong></span>
    </div>

    <canvas id="loss-chart" width="200" height="20" style="width:100%;height:20px;margin:2px 0 4px;"></canvas>

    <button id="takeover-btn" class="takeover-off" onclick="toggleTakeover()">TAKE OVER</button>

    <div class="joypad">
      <div class="key empty"></div>
      <div class="key" data-gb="UP">↑</div>
      <div class="key empty"></div>
      <div class="key" data-gb="LEFT">←</div>
      <div class="key" data-gb="DOWN">↓</div>
      <div class="key" data-gb="RIGHT">→</div>
      <div class="key" data-gb="SELECT">SEL</div>
      <div class="key" data-gb="START">STR</div>
      <div class="key empty"></div>
      <div class="key" data-gb="A">A</div>
      <div class="key empty"></div>
      <div class="key" data-gb="B">B</div>
    </div>

    <div class="log-panel">
      <div class="log-header">Log</div>
      <div id="log"></div>
    </div>
  </div>

</div>

<script>
const canvas = document.getElementById('gb-screen');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('log');
const actionList = document.getElementById('action-list');

let ws = null;
let connected = false;
const KEY_MAP = {
  'w': 'UP', 'a': 'LEFT', 's': 'DOWN', 'd': 'RIGHT',
  'k': 'A', 'j': 'B', 'h': 'START', 'g': 'SELECT',
};

function log(msg, cls) {
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.textContent = '> ' + msg;
  logEl.appendChild(p);
  logEl.scrollTop = logEl.scrollHeight;
  if (logEl.children.length > 100) logEl.removeChild(logEl.firstChild);
}

function addAction(tool, args) {
  const now = new Date();
  const time = now.toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'action-item';
  div.innerHTML = `<div><span class="action-tool">${tool}</span> <span class="action-time">${time}</span></div><div class="action-args">${args || ''}</div>`;
  actionList.appendChild(div);
  actionList.scrollTop = actionList.scrollHeight;
  if (actionList.children.length > 200) actionList.removeChild(actionList.firstChild);
  // clear placeholder if present
  const ph = actionList.querySelector('div:first-child');
  if (ph && ph.textContent.includes('Waiting')) ph.remove();
}

// ---------------------------------------------------------------------------
// WebAudio audio playback — chained scheduling, APU-rate matched, capped
// ---------------------------------------------------------------------------
let audioCtx = null;
let audioSch = 0;
const APU_RATE = 44150; // 4,194,304 / 95 T-cycles per sample

function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  return audioCtx;
}

function onAudioSamples(samples) {
  if (samples.length < 2) return;
  const ctx = ensureAudioContext();
  const len = samples.length;
  const frames = len / 2;
  const floatBuf = new Float32Array(len);
  for (let i = 0; i < len; i++) {
    floatBuf[i] = Math.max(-1, Math.min(1, samples[i] / 32768));
  }
  const buffer = ctx.createBuffer(2, frames, APU_RATE);
  const chL = buffer.getChannelData(0);
  const chR = buffer.getChannelData(1);
  for (let i = 0, j = 0; i < len; i += 2, j++) {
    chL[j] = floatBuf[i];
    chR[j] = floatBuf[i + 1];
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  source.connect(ctx.destination);
  // chain: drift is only ~4µs/frame with APU_RATE, cap prevents long-term creep
  if (audioSch < ctx.currentTime) {
    audioSch = ctx.currentTime;
  }
  source.start(audioSch);
  audioSch += frames / APU_RATE;
  if (audioSch - ctx.currentTime > 0.1) {
    audioSch = ctx.currentTime + 0.05;
  }
}

// ---------------------------------------------------------------------------
// Takeover toggle + reward chart
// ---------------------------------------------------------------------------
let takeoverActive = false;

function toggleTakeover() {
  takeoverActive = !takeoverActive;
  const btn = document.getElementById('takeover-btn');
  btn.textContent = takeoverActive ? 'RELEASE CONTROL' : 'TAKE OVER';
  btn.className = takeoverActive ? 'takeover-on' : 'takeover-off';
  if (connected && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ takeover: takeoverActive }));
  }
}

const rewardPoints = [];
const lossPoints = [];

function addRewardPoint(total, breakdown) {
  const now = Date.now();
  rewardPoints.push({ time: now, total });
  while (rewardPoints.length && rewardPoints[0].time < now - 300000)
    rewardPoints.shift();
  drawRewardChart();
}

function addLossPoint(loss, epsilon, sps) {
  document.getElementById('loss-val').textContent = loss.toFixed(4);
  document.getElementById('eps-val').textContent = epsilon.toFixed(3);
  document.getElementById('sps-val').textContent = sps != null ? Math.round(sps).toString() : '\u2014';
  const now = Date.now();
  lossPoints.push({ time: now, loss });
  while (lossPoints.length && lossPoints[0].time < now - 300000)
    lossPoints.shift();
  drawLossChart();
}

function drawRewardChart() {
  const c = document.getElementById('reward-chart');
  if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  if (rewardPoints.length < 2) {
    ctx.fillStyle = '#666';
    ctx.font = '10px monospace';
    ctx.fillText('reward: waiting...', 4, 12);
    return;
  }
  const vals = rewardPoints.map(r => r.total);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  ctx.beginPath();
  vals.forEach((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#4caf50';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#aaa';
  ctx.font = '10px monospace';
  ctx.fillText(vals[vals.length-1].toFixed(2), 4, 10);
}

function drawLossChart() {
  const c = document.getElementById('loss-chart');
  if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  if (lossPoints.length < 2) {
    ctx.fillStyle = '#666';
    ctx.font = '9px monospace';
    ctx.fillText('loss: waiting...', 4, 12);
    return;
  }
  const vals = lossPoints.map(r => r.loss);
  const max = Math.max(...vals, 0.01);
  ctx.beginPath();
  vals.forEach((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - (Math.min(v, max) / max) * (h - 4) - 2;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#ff9800';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#aaa';
  ctx.font = '9px monospace';
  ctx.fillText(vals[vals.length-1].toFixed(4), 4, 10);
}

// ---------------------------------------------------------------------------
// WebSocket
// ---------------------------------------------------------------------------
function connect() {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');

  ws.onopen = () => {
    connected = true;
    document.getElementById('status-dot').className = 'status-dot connected';
    document.getElementById('status-text').textContent = 'Connected';
    log('WebSocket connected');
  };

  ws.onclose = () => {
    connected = false;
    document.getElementById('status-dot').className = 'status-dot disconnected';
    document.getElementById('status-text').textContent = 'Disconnected';
    log('WebSocket disconnected — reconnecting in 2s', 'error');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => { log('WebSocket error', 'error'); };

  ws.binaryType = 'arraybuffer';
  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      const dv = new DataView(event.data);
      const type = dv.getUint8(0);
      const payload = event.data.slice(1);
      if (type === 0x00) {
        // PNG screenshot
        const blob = new Blob([payload], { type: 'image/png' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
        };
        img.onerror = () => { URL.revokeObjectURL(url); };
        img.src = url;
      } else if (type === 0x01) {
        // Audio samples: 2-byte sample count + raw int16 LE interleaved stereo
        const numSamples = dv.getUint16(1, true);
        const samples = [];
        for (let i = 0; i < numSamples * 2; i++) {
          samples.push(dv.getInt16(3 + i * 2, true));
        }
        onAudioSamples(samples);
      }
    } else {
      try {
        const data = JSON.parse(event.data);
        if (data.action) {
          addAction(data.action, data.args || '');
          return;
        }
        if (data.reward_total != null) {
          addRewardPoint(data.reward_total, data.breakdown || {});
        }
        if (data.loss != null) {
          addLossPoint(data.loss, data.epsilon || 0, data.sps);
        }
      } catch(e) {
        log(event.data);
      }
    }
  };
}

// Keyboard input
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const gbBtn = KEY_MAP[e.key];
  if (gbBtn) {
    e.preventDefault();
    document.querySelector(`[data-gb="${gbBtn}"]`)?.classList.add('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: e.key, pressed: true }));
    }
  }
});

document.addEventListener('keyup', (e) => {
  const gbBtn = KEY_MAP[e.key];
  if (gbBtn) {
    e.preventDefault();
    document.querySelector(`[data-gb="${gbBtn}"]`)?.classList.remove('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: e.key, pressed: false }));
    }
  }
});

document.querySelectorAll('[data-gb]').forEach(el => {
  const gbBtn = el.dataset.gb;
  const keyName = { 'UP': 'w', 'DOWN': 's', 'LEFT': 'a', 'RIGHT': 'd',
                    'A': 'k', 'B': 'j', 'START': 'h', 'SELECT': 'g' }[gbBtn] || gbBtn;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    el.classList.add('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: keyName, pressed: true }));
    }
  });
  el.addEventListener('pointerup', (e) => {
    e.preventDefault();
    el.classList.remove('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: keyName, pressed: false }));
    }
  });
  el.addEventListener('pointerleave', (e) => {
    e.preventDefault();
    el.classList.remove('active');
    if (connected && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ key: keyName, pressed: false }));
    }
  });
});

log('gbagent dashboard loaded');
connect();
</script>
</body>
</html>
