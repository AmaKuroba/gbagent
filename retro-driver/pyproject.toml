[project]
name = "retro-driver"
version = "0.1.0"
description = "Reinforcement learning agent that learns to play retro games via gbagent"
license = "MIT"
requires-python = ">=3.12"

dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6.0",
    "torch>=2.3",
    "tensorboard>=2.18",
    "websocket-client>=1.8",
]

[project.scripts]
retro-train = "retro_driver.train:main"
retro-play = "retro_driver.play:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PERF", "NPY", "RUF", "PTH", "RET", "FBT"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E731",  # lambda assignment
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
    "N815",  # class attribute should be lowercase
    "SIM114", # combine if expressions
    "UP038",  # isinstance() with non-tuple
    "N812",   # lowercase module imported as non-lowercase (torch.nn.functional as F)
    "SIM115", # context manager for open (tempfile with delete=False is intentional)
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.setuptools.packages.find]
where = ["."]
include = ["retro_driver*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
