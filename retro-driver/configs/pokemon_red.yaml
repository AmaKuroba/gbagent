# Pokémon Red/Blue — RAM scanner reward configuration
#
# Addresses verified against the pret/pokered disassembly
# and Bulbapedia RAM map. wEventFlags base: $D747.
#
# Scanner types:
#   discrete — fires once (reward_on_change) when the byte changes
#   delta    — sums bytes over [ram_addr, ram_addr+length), rewards positive change
#   state_penalty — applies penalty_per_step every step matching target_value
#   first_visit — fires once per unique value ever seen at ram_addr
#   stuck_penalty — applies penalty_per_step after grace_period steps of unchanged value

game: "pokemon_red"
scanners:

  # ── Title screen / intro anti-idle ──────────────────────
  # hGameState = 0x00 = title/intro. -0.1/step while stuck.
  - type: state_penalty
    name: "on_title_screen"
    ram_addr: 0xFFCC
    target_value: 0x00
    penalty_per_step: -0.1

  # ── Exploration ─────────────────────────────────────────
  # wCurMap at 0xD35E (1 byte, map ID). Rewards once per
  # unique map. No farming back-and-forth between rooms.
  - type: first_visit
    name: "new_map"
    ram_addr: 0xD35E
    reward_on_change: 5.0

  # ── Room stuck penalty ─────────────────────────────────-
  # wCurMap at 0xD35E. If the agent stays in the same map
  # for >150 steps (~1.25 min), -0.05/step until it leaves.
  - type: stuck_penalty
    name: "stuck_in_room"
    ram_addr: 0xD35E
    grace_period: 150
    penalty_per_step: -0.05

  # ── Player movement ────────────────────────────────────
  # wXCoord at 0xD362, wYCoord at 0xD361. Small per-step
  # rewards for any movement. Not anti-grind (that's below).
  - type: discrete
    name: "player_moved_x"
    ram_addr: 0xD362
    reward_on_change: 0.02

  - type: discrete
    name: "player_moved_y"
    ram_addr: 0xD361
    reward_on_change: 0.02

  # ── Player health ──────────────────────────────────────
  # wPartyMon1HP at 0xD16A (2 bytes, little-endian).
  # Rewards healing (potions, Pokémon Center). Positive delta only.
  - type: delta
    name: "player_hp"
    ram_addr: 0xD16A
    length: 2
    reward_per_unit: 0.5

  # wPartyMon1MaxHP at 0xD1C8 (2 bytes, little-endian).
  # Rewards when max HP increases (evolution, level-up).
  - type: delta
    name: "max_hp"
    ram_addr: 0xD1C8
    length: 2
    reward_per_unit: 1.0

  # ── Party progress ─────────────────────────────────────
  # wPartyCount at 0xD15D (1 byte, 0-6).
  - type: discrete
    name: "party_count_up"
    ram_addr: 0xD15D
    reward_on_change: 2.0

  # wObtainedBadges at 0xD356 (1 byte, bitmask per badge).
  # Fires only when badge byte changes (only increases).
  - type: discrete
    name: "badge_earned"
    ram_addr: 0xD356
    reward_on_change: 20.0

  # ── Money ──────────────────────────────────────────────
  # wMoney at 0xD355 (3 bytes, BCD). Discrete on low byte
  # triggers on any money change.
  - type: discrete
    name: "money_changed"
    ram_addr: 0xD355
    reward_on_change: 0.5

  # ── Battles ────────────────────────────────────────────
  # wBattleType at 0xD00B (0 = no battle, 1+ = battle).
  - type: discrete
    name: "battle_start"
    ram_addr: 0xD00B
    reward_on_change: 0.5

  # ── Pokédex ────────────────────────────────────────────
  # wPokedexOwned at 0xD30A (bitfield, 16 bytes).
  - type: delta
    name: "pokedex_owned"
    ram_addr: 0xD30A
    length: 16
    reward_per_unit: 5.0

  # wPokedexSeen at 0xD2F7 (bitfield, 16 bytes).
  - type: delta
    name: "pokedex_seen"
    ram_addr: 0xD2F7
    length: 16
    reward_per_unit: 0.5

  # ── Event flags — early game ──────────────────────────
  # wEventFlags bytes $D747-$D74B. Use delta (length=1)
  # so only flag SETS (byte increases) give reward.
  # Covers: Pokedex, starter, Oak's Parcel, rival in lab,
  # Town Map, Pokeballs.
  - type: delta
    name: "events_early_0"
    ram_addr: 0xD747
    length: 1
    reward_per_unit: 0.5

  - type: delta
    name: "events_early_1"
    ram_addr: 0xD748
    length: 1
    reward_per_unit: 0.5

  - type: delta
    name: "events_early_2"
    ram_addr: 0xD749
    length: 1
    reward_per_unit: 0.5

  - type: delta
    name: "events_early_3"
    ram_addr: 0xD74A
    length: 1
    reward_per_unit: 0.5

  - type: delta
    name: "events_early_4"
    ram_addr: 0xD74B
    length: 1
    reward_per_unit: 0.5

  # ── Event flags — Viridian / Pewter ──────────────────
  # $D752 (beat Giovanni), $D755 (beat Brock), $D756
  - type: delta
    name: "events_viridian"
    ram_addr: 0xD752
    length: 1
    reward_per_unit: 1.0

  - type: delta
    name: "events_pewter"
    ram_addr: 0xD755
    length: 1
    reward_per_unit: 1.0

  # ── Rival battles ─────────────────────────────────────
  # Cerulean rival at $D75A, Pokemon Tower rival at $D765
  - type: delta
    name: "rival_cerulean"
    ram_addr: 0xD75A
    length: 1
    reward_per_unit: 2.0

  - type: delta
    name: "rival_tower"
    ram_addr: 0xD765
    length: 1
    reward_per_unit: 2.0

  # ── Key items / story flags ───────────────────────────
  # $D82B-D$D82D (game progress flags bitfield). Delta over
  # 3 bytes catches Pokedex, SS Ticket, Bike, key items.
  - type: delta
    name: "story_progress"
    ram_addr: 0xD82B
    length: 3
    reward_per_unit: 1.0
