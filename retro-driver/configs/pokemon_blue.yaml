# Pokémon Blue — RAM scanner reward configuration
#
# Same addresses as Pokemon Red (Gen 1 shared memory map)
# Verified against pret/pokered .sym file

game: "pokemon_blue"

# Pre-saved start state (create manually via dashboard)
start_state: "checkpoints/pokemon_blue_outskirts.sav"

scanners:
  # ── Exploration ─────────────────────────────────────────
  - type: first_visit
    name: "new_map"
    ram_addr: 0xD35E
    reward_on_change: 5.0

  # ── Room stuck penalty ──────────────────────────────────
  - type: stuck_penalty
    name: "stuck_in_room"
    ram_addr: 0xD35E
    grace_period: 30
    penalty_per_step: -0.05

  # ── Player movement ────────────────────────────────────
  - type: discrete
    name: "player_moved_x"
    ram_addr: 0xD362
    reward_on_change: 0.1

  - type: discrete
    name: "player_moved_y"
    ram_addr: 0xD361
    reward_on_change: 0.1

  # ── Player health ──────────────────────────────────────
  - type: delta
    name: "player_hp"
    ram_addr: 0xD16C
    length: 2
    reward_per_unit: 0.05

  - type: delta
    name: "max_hp"
    ram_addr: 0xD18D
    length: 2
    reward_per_unit: 0.1

  # ── Party progress ─────────────────────────────────────
  - type: discrete
    name: "party_count_up"
    ram_addr: 0xD163
    reward_on_change: 2.0

  - type: discrete
    name: "badge_earned"
    ram_addr: 0xD356
    reward_on_change: 20.0

  # ── Money ──────────────────────────────────────────────
  - type: discrete
    name: "money_changed"
    ram_addr: 0xD347
    reward_on_change: 0.5

  # ── Battles ────────────────────────────────────────────
  - type: discrete
    name: "battle_start"
    ram_addr: 0xD05A
    reward_on_change: 0.5

  # ── Pokédex ────────────────────────────────────────────
  - type: first_visit
    name: "pokedex_owned"
    ram_addr: 0xD2F7
    reward_on_change: 5.0

  - type: delta
    name: "pokedex_seen"
    ram_addr: 0xD30A
    length: 19
    reward_per_unit: 0.5

  # ── Event flags — early game ──────────────────────────
  - type: delta
    name: "events_early_0"
    ram_addr: 0xD747
    length: 1
    reward_per_unit: 0.5

  - type: delta
    name: "events_early_1"
    ram_addr: 0xD748
    length: 1
    reward_per_unit: 0.5

  - type: delta
    name: "events_early_2"
    ram_addr: 0xD749
    length: 1
    reward_per_unit: 0.5

  - type: delta
    name: "events_early_3"
    ram_addr: 0xD74A
    length: 1
    reward_per_unit: 0.5

  - type: delta
    name: "events_early_4"
    ram_addr: 0xD74B
    length: 1
    reward_per_unit: 0.5

  # ── Event flags — Viridian / Pewter ──────────────────
  - type: delta
    name: "events_viridian"
    ram_addr: 0xD752
    length: 1
    reward_per_unit: 1.0

  - type: delta
    name: "events_pewter"
    ram_addr: 0xD755
    length: 1
    reward_per_unit: 1.0

  # ── Rival battles ─────────────────────────────────────
  - type: delta
    name: "rival_cerulean"
    ram_addr: 0xD75A
    length: 1
    reward_per_unit: 2.0

  - type: delta
    name: "rival_tower"
    ram_addr: 0xD765
    length: 1
    reward_per_unit: 2.0

  # ── Key items / story flags ───────────────────────────
  - type: delta
    name: "story_progress"
    ram_addr: 0xD82B
    length: 3
    reward_per_unit: 1.0
