# GBAGent — Long-run configuration (default hyperparams, extended timesteps)
# ──────────────────────────────────────────────────────────────────────
#
# This config extends ``default.yaml`` with 50M total timesteps and a
# longer rollout horizon for more stable learning over extended runs.
# Use this for the first long training session on any new game.
#
# ── How to run ───────────────────────────────────────────────────────
#
#   python train.py --config configs/long_run_pokemon.yaml
#   # or for a specific game:
#   python train.py --config configs/long_run_default.yaml --game Tetris-GB

env:
  game: PokemonRed-GB
  state: Level1
  frame_skip: 4
  frame_stack: 4
  render_mode: null

agent:
  # ── ViT ──────────────────────────────────────────────────────────
  patch_size: 16
  embed_dim: 256
  num_layers: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  # ── Actor-Critic ─────────────────────────────────────────────────
  hidden_dim: 512
  # ── PPO ──────────────────────────────────────────────────────────
  learning_rate: 3.0e-4        # standard PPO starting LR
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 4
  num_minibatches: 4

train:
  # ── Extended horizon ─────────────────────────────────────────────
  total_timesteps: 50_000_000  # 5× standard — gives plenty of wall time
  num_envs: 8
  n_steps: 128                 # rollout length (maintains 1,024 samples/iteration)
  batch_size: 256
  log_interval: 100
  save_interval: 1_000_000     # save every million steps on long runs
  checkpoint_dir: checkpoints
  log_dir: logs
  seed: 42
  dashboard_port: 8765

recorder:
  output_dir: recordings
  enabled: false
  encode_mp4_on_stop: true
  ffmpeg_crf: 23
  ffmpeg_preset: medium
  max_frames: 0

reward:
  screen_novelty_scale: 0.001
  stale_penalty: -0.01
  stale_threshold: 200
  stale_diff_threshold: 0.001
  ram_scanners: []
