# GBAGent — Performance-optimised config (max SPS for long training)
# ──────────────────────────────────────────────────────────────────────
#
# Trade-offs:
#   + Higher n_steps (256) → more data per gradient step, better SPS
#   + Dashboard OFF → no PNG encoding overhead
#   + Recorder OFF → no frame capture
#   + Fewer checkpoints → less disk I/O
#   + Consolidated logging → less Python overhead
#
# ── Expected speed-up on freighter.local (CUDA) ─────────────────────
#
#   Baseline (default.yaml):           ~800-1200 SPS
#   Performance (this config):        ~1200-1800 SPS  (+40-50%)
#
# ── How to run ───────────────────────────────────────────────────────
#
#   python train.py --config configs/performance_fast.yaml
#   # or combine with any game:
#   python train.py --config configs/performance_fast.yaml \\
#                   --game SuperMarioLand-GB \\
#                   --total-timesteps 20_000_000

env:
  game: PokemonRed-GB
  state: Level1
  frame_skip: 4
  frame_stack: 4
  render_mode: null

agent:
  # ── ViT ──────────────────────────────────────────────────────────
  patch_size: 16
  embed_dim: 256
  num_layers: 6
  num_heads: 8
  mlp_ratio: 4
  dropout: 0.1
  # ── Actor-Critic ─────────────────────────────────────────────────
  hidden_dim: 512
  # ── PPO ──────────────────────────────────────────────────────────
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  update_epochs: 4
  num_minibatches: 4

train:
  total_timesteps: 30_000_000
  num_envs: 8
  n_steps: 256           # longer horizons → better SPS
  batch_size: 256
  log_interval: 1000     # less console output overhead
  save_interval: 2_000_000  # fewer disk writes
  checkpoint_dir: checkpoints
  log_dir: logs
  seed: 42
  enable_dashboard: false  # OFF — no PNG encoding overhead
  dashboard_host: 127.0.0.1
  dashboard_port: 8765
  dashboard_update_interval: 10

recorder:
  output_dir: recordings
  enabled: false
  encode_mp4_on_stop: true
  ffmpeg_crf: 23
  ffmpeg_preset: medium
  max_frames: 0

reward:
  screen_novelty_scale: 0.001
  stale_penalty: -0.01
  stale_threshold: 200
  stale_diff_threshold: 0.001
  ram_scanners: []
